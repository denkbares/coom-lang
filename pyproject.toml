# The workspace of the Python packages that implement COOM. The root is no package itself, each package lives in
# packages/ and shares the namespace coom.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
coom-core = { workspace = true }
coom-lang = { workspace = true }
coom-clingo = { workspace = true }
coom-api = { workspace = true }

[dependency-groups]
dev = [
    "coom-core",
    "coom-lang",
    "coom-clingo",
    "coom-api",
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
    "antlr4-tools",
]

[tool.ruff]
line-length = 120
src = ["packages/*/src"]
extend-exclude = ["packages/coom-lang/src/coom/parser/_antlr"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Creates a fresh dataclass field, so the call is safe as a default.
extend-immutable-calls = ["coom.model._base.span_field"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/*/src", "packages/*/tests"]
exclude = ["packages/coom-lang/src/coom/parser/_antlr"]
# coom is a namespace package spread over several source roots
mypy_path = [
    "packages/coom-core/src",
    "packages/coom-lang/src",
    "packages/coom-clingo/src",
    "packages/coom-api/src",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["clingo", "clingo.*", "antlr4", "antlr4.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["coom.parser._antlr.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["packages"]
# the test folders of the packages are no packages, so their modules are imported by path
addopts = ["--import-mode=importlib"]
