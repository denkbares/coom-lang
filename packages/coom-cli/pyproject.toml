[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "coom-cli"
version = "0.0.1a1"
description = "Command line interface of the COOM product configuration language"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "denkbares GmbH", email = "info@denkbares.com" }]
keywords = ["coom", "product configuration", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "coom-core==0.0.1a1",
    "coom-lang==0.0.1a1",
]

[project.scripts]
coom = "coom.cli:main"

[project.urls]
Homepage = "https://www.coom-lang.org"
Repository = "https://github.com/denkbares/coom-api"
Changelog = "https://github.com/denkbares/coom-api/blob/main/CHANGELOG.md"

[tool.uv.build-backend]
module-name = "coom.cli"

[tool.uv.sources]
coom-core = { workspace = true }
coom-lang = { workspace = true }
